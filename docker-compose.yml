# Production-style stack: the app (dashboard + API) behind Caddy, which provides HTTPS and a password.
#   cp deploy.env.example deploy.env   (edit it)   ->   see docs/DEPLOYMENT.md
#   docker compose --env-file deploy.env up -d --build
services:
  app:
    build:
      context: .
      args:
        TENSORFLOW_VERSION: ${TENSORFLOW_VERSION:?set TENSORFLOW_VERSION in deploy.env}
    restart: unless-stopped
    environment:
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
    volumes:
      - ./models:/app/models:ro      # defect_model.keras + labels.json + ood.npz (deploy them together)
      - appdata:/app/data            # database + stored geometry survive restarts and rebuilds
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data             # certificates
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
